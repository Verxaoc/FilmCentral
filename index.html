<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная – Кино-База</title>
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-body-tertiary">

    <!-- Главный блок -->
    <section class="container my-5">
        <div class="row g-4 align-items-stretch">
            
            <!-- ЛЕВАЯ КОЛОНКА: Новинки -->
            <div class="col-12 col-lg-3 order-2 order-lg-1">
                <h3 class="h5 text-warning mb-3 border-bottom border-secondary pb-2">Новинки</h3>
                <div class="d-flex flex-column gap-3" id="newMoviesLeft">
                    <!-- Сюда JS вставит карточки -->
                </div>
            </div>

            <!-- ЦЕНТР: Пустое место для будущего контента (Hero, баннер, промо) -->
            <div class="col-12 col-lg-6 order-1 order-lg-2">
                <div class="h-100 p-5 bg-body-secondary border rounded shadow-sm d-flex flex-column justify-content-center align-items-center text-center" style="min-height: 500px;">
                    <h1 class="display-4 fw-bold mb-4">Добро пожаловать в Кино-Базу</h1>
                    <p class="lead text-muted mb-4">Здесь скоро появится главный баннер, подборка недели или анонс премьер.</p>
                    <a href="catalog.html" class="btn btn-warning btn-lg px-4">Перейти в каталог фильмов</a>
                </div>
            </div>

            <!-- ПРАВАЯ КОЛОНКА: Новинки -->
            <div class="col-12 col-lg-3 order-3">
                <h3 class="h5 text-warning mb-3 border-bottom border-secondary pb-2">Скоро в кино</h3>
                <div class="d-flex flex-column gap-3" id="newMoviesRight">
                    <!-- Сюда JS вставит карточки -->
                </div>
            </div>

        </div>
    </section>

    <!-- Кнопка "Наверх" -->
    <button id="scrollTopBtn" class="btn btn-warning rounded-circle shadow" title="Наверх">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M7.646 2.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 3.707 2.354 9.354a.5.5 0 1 1-.708-.708l6-6z"/>
            <path fill-rule="evenodd" d="M7.646 6.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 7.707l-5.646 5.647a.5.5 0 0 1-.708-.708l6-6z"/>
        </svg>
    </button>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/scroll.js"></script> 
</body>
</html>
