<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты – Кино-База</title>
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-body-tertiary">

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="display-6 fw-bold mb-4 text-center">Свяжитесь с нами</h1>
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <p class="text-muted mb-4">Если у вас есть вопросы, предложения о сотрудничестве или вы нашли ошибку на сайте, заполните форму ниже.</p>
                        
                        <form>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Ваше имя</label>
                                    <input type="text" class="form-control" id="name" placeholder="Иван Иванов" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">E-mail</label>
                                    <div class="input-group">
                                        <span class="input-group-text">@</span>
                                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label for="message" class="form-label">Сообщение</label>
                                    <textarea class="form-control" id="message" rows="4" required></textarea>
                                </div>
                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="agree" required>
                                        <label class="form-check-label" for="agree">
                                            Я согласен на обработку персональных данных
                                        </label>
                                    </div>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary w-100 py-2">Отправить сообщение</button>
                                </div>
                            </div>
                        </form>

                        <hr class="my-4">
                        
                        <div class="row text-center mt-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <h5 class="h6 text-muted">Электронная почта</h5>
                                <a href="mailto:info@kinobaza.ru" class="text-decoration-none">info@kinobaza.ru</a>
                            </div>
                            <div class="col-md-6">
                                <h5 class="h6 text-muted">Телефон</h5>
                                <a href="tel:+78005553535" class="text-decoration-none">+7 (800) 555-35-35</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <button id="scrollTopBtn" class="btn btn-warning rounded-circle shadow" title="Наверх">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M7.646 2.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 3.707 2.354 9.354a.5.5 0 1 1-.708-.708l6-6z"/>
            <path fill-rule="evenodd" d="M7.646 6.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 7.707l-5.646 5.647a.5.5 0 0 1-.708-.708l6-6z"/>
        </svg>
    </button>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/scroll.js"></script> 
</body>
</html>
